<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Achadinhos - Ofertas</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <header class="header">
    <div class="header-container">
      <div class="logo-area">
        <img src="assets/logo.png" alt="Achadinhos" class="logo-img">
        <h1 class="logo-text">Achadinhos <span>Ofertas</span></h1>
      </div>

      <input 
        type="text" 
        id="busca" 
        placeholder="Buscar produto..." 
        class="campo-busca"
      >
    </div>
  </header>

  <section class="hero">
    <span class="badge">🔥 Ofertas selecionadas</span>

    <h2>Encontre os melhores <span>achadinhos</span></h2>

    <p>
      Produtos com preços promocionais, atualizados para você economizar mais.
    </p>
  </section>

  <main class="conteudo">
    <div class="titulo-area">
      <h2>Produtos em destaque</h2>
      <p id="contador-produtos">0 produtos</p>
    </div>

    <div class="filtros">
      <button class="filtro ativo" data-filtro="todos">Todos</button>
      <button class="filtro" data-filtro="recentes">Recentes</button>
      <button class="filtro" data-filtro="clicados">Mais clicados</button>
    </div>

    <div id="grid" class="grid-produtos"></div>
  </main>

  <footer class="footer">
    © 2026 Achadinhos - Ofertas selecionadas
  </footer>

  <script src="js/script.js"></script>

</body>
</html>
