<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achadinhos da Shopee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    
    .category-chip {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .category-chip:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgb(249 115 22 / 0.3);
    }
    
    .category-chip.active {
      background-color: #f97316;
      color: white;
      border-color: #f97316;
    }
    
    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: white;
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">

  <!-- Header -->
  <header class="bg-black border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-orange-600 rounded-full flex items-center justify-center text-2xl">👑</div>
        <div>
          <span class="text-2xl font-bold tracking-tight">Achadinhos da <span class="text-orange-500">Shopee</span></span>
        </div>
      </div>
      
      <div class="flex-1 max-w-xl mx-8">
        <div class="relative">
          <input type="text" 
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-full py-3 px-5 pl-12 focus:outline-none focus:border-orange-500 text-sm"
                 placeholder="Buscar produto...">
          <i class="fa-solid fa-magnifying-glass absolute left-5 top-3.5 text-zinc-500"></i>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-8">

    <!-- Countdown -->
    <div class="flex justify-center mb-10">
      <div class="bg-zinc-900 rounded-3xl px-10 py-5 text-center shadow-xl">
        <p class="text-sm text-zinc-400 mb-3">Ofertas de hoje acabam em:</p>
        <div class="flex gap-8 text-5xl font-bold">
          <div><span class="text-orange-500">05</span><span class="text-xs block text-zinc-500 mt-1">HORAS</span></div>
          <div><span class="text-orange-500">42</span><span class="text-xs block text-zinc-500 mt-1">MIN</span></div>
          <div><span class="text-orange-500">51</span><span class="text-xs block text-zinc-500 mt-1">SEG</span></div>
        </div>
      </div>
    </div>

    <h1 class="text-5xl font-bold text-center mb-10">Encontre os melhores <span class="text-orange-500">achadinhos</span></h1>

    <!-- Categorias Principais -->
    <div class="mb-12">
      <div class="flex items-center gap-3 mb-6">
        <h2 class="section-title">Categorias em Destaque</h2>
        <div class="h-px flex-1 bg-gradient-to-r from-orange-500 to-transparent"></div>
      </div>
      
      <div class="flex flex-wrap gap-3" id="main-categories"></div>
    </div>

    <!-- Todas as Categorias - Mais visível -->
    <div class="mb-16">
      <div class="flex items-center justify-between mb-6">
        <h2 class="section-title">Todas as Categorias</h2>
        <button onclick="toggleCategories()" 
                class="text-orange-500 hover:text-orange-400 font-medium flex items-center gap-2">
          <span id="toggle-text">Ver todas</span>
          <i class="fa-solid fa-chevron-down transition-transform" id="toggle-icon"></i>
        </button>
      </div>
      
      <div id="all-categories" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <!-- JS vai preencher aqui -->
      </div>
    </div>

    <!-- Produtos em Destaque -->
    <div>
      <div class="flex justify-between items-center mb-8">
        <h2 class="section-title">Produtos em Destaque</h2>
        <span class="text-zinc-500">135 produtos</span>
      </div>
      
      <!-- Aqui você pode colar seus cards de produtos depois -->
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="products-grid">
        <!-- Seus produtos vão aqui -->
      </div>
    </div>
  </div>

  <script>
    const mainCats = [
      {name: "Todos", active: true},
      {name: "Recentes"},
      {name: "Mais clicados"}
    ];

    const categories = [
      "Todas categorias", "Auto", "Ferramentas", "Casa", 
      "Cozinha", "Mulher", "Treino", "Vestuário", 
      "Brinquedo", "Presente", "Eletrônicos"
    ];

    function getIcon(cat) {
      const icons = {
        "Todas categorias": "🌐",
        "Auto": "🚗",
        "Ferramentas": "🔧",
        "Casa": "🏠",
        "Cozinha": "🍳",
        "Mulher": "👩",
        "Treino": "🏋️",
        "Vestuário": "👕",
        "Brinquedo": "🧸",
        "Presente": "🎁",
        "Eletrônicos": "📱"
      };
      return icons[cat] || "📦";
    }

    function renderMainCategories() {
      const container = document.getElementById('main-categories');
      container.innerHTML = mainCats.map(cat => `
        <button onclick="setActive(this)" class="category-chip px-8 py-3 rounded-full font-medium text-base border ${cat.active ? 'active border-orange-500' : 'border-zinc-700 hover:border-zinc-600 bg-zinc-900'}">
          ${cat.name}
        </button>
      `).join('');
    }

    function renderAllCategories() {
      const container = document.getElementById('all-categories');
      container.innerHTML = categories.map(cat => `
        <div onclick="selectCategory(this)" class="category-chip bg-zinc-900 border border-zinc-800 hover:border-orange-600 rounded-3xl p-6 text-center cursor-pointer group">
          <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center text-4xl transition-transform group-hover:scale-110">
            ${getIcon(cat)}
          </div>
          <p class="font-semibold text-lg">${cat}</p>
        </div>
      `).join('');
    }

    function setActive(el) {
      document.querySelectorAll('#main-categories button').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
    }

    function selectCategory(el) {
      document.querySelectorAll('#all-categories > div').forEach(div => div.classList.remove('!border-orange-500', 'bg-orange-950/30'));
      el.classList.add('!border-orange-500', 'bg-orange-950/30');
    }

    function toggleCategories() {
      const grid = document.getElementById('all-categories');
      const icon = document.getElementById('toggle-icon');
      const text = document.getElementById('toggle-text');
      
      if (grid.style.maxHeight) {
        grid.style.maxHeight = null;
        icon.style.transform = 'rotate(0deg)';
        text.textContent = 'Ver todas';
      } else {
        grid.style.maxHeight = grid.scrollHeight + "px";
        icon.style.transform = 'rotate(180deg)';
        text.textContent = 'Ver menos';
      }
    }

    // Inicializa tudo
    window.onload = () => {
      renderMainCategories();
      renderAllCategories();
    };
  </script>
</body>
</html>
