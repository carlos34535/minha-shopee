<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Produtos Shopee</title>

<style>
body {
  background: #0f0f0f;
  color: #fff;
  font-family: Arial;
  padding: 20px;
}

h2 {
  margin-bottom: 10px;
}

#categorias {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.btn-categoria {
  background: #111;
  color: #fff;
  border: 1px solid #333;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
}

.btn-categoria:hover {
  background: orange;
}

select {
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 15px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.btn {
  background: orange;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>Produtos em destaque</h2>

<!-- DROPDOWN -->
<select id="categoriaSelect">
  <option value="Todos">Todas categorias</option>
</select>

<!-- BOTÕES -->
<div id="categorias"></div>

<!-- PRODUTOS -->
<div class="grid" id="produtos"></div>

<script>

// =====================
// DADOS (EXEMPLO)
// =====================
const produtos = [
  {nome:"Parafusadeira 48V", categoria:"Ferramentas", imagem:"002.webp", link:"#"},
  {nome:"Removedor de Arranhões", categoria:"Auto", imagem:"003.webp", link:"#"},
  {nome:"Camera Wifi", categoria:"Casa", imagem:"006.webp", link:"#"},
  {nome:"Smartwatch", categoria:"Eletronicos", imagem:"107.webp", link:"#"},
  {nome:"Kit Marmita", categoria:"Cozinha", imagem:"100.webp", link:"#"},
  {nome:"Produto Bugado", categoria:"https://erro.com", imagem:"bug.webp", link:"#"}
];


// =====================
// LIMPAR CATEGORIA
// =====================
function limparCategoria(cat) {
  if (!cat) return "Outros";

  cat = cat.trim();

  if (cat.includes("http") || cat.includes(".webp")) {
    return "Outros";
  }

  if (cat === "Csa") return "Casa";

  return cat;
}


// =====================
// GERAR CATEGORIAS
// =====================
const categorias = ["Todos", ...new Set(
  produtos.map(p => limparCategoria(p.categoria))
)];


// =====================
// DROPDOWN
// =====================
const select = document.getElementById("categoriaSelect");

categorias.forEach(cat => {
  const option = document.createElement("option");
  option.value = cat;
  option.textContent = cat;
  select.appendChild(option);
});

select.onchange = () => filtrar(select.value);


// =====================
// BOTÕES
// =====================
const container = document.getElementById("categorias");

categorias.forEach(cat => {
  const btn = document.createElement("button");

  btn.innerText = cat;
  btn.className = "btn-categoria";

  btn.onclick = () => filtrar(cat);

  container.appendChild(btn);
});


// =====================
// FILTRO
// =====================
function filtrar(categoria) {

  let filtrados;

  if (categoria === "Todos") {
    filtrados = produtos;
  } else {
    filtrados = produtos.filter(p =>
      limparCategoria(p.categoria) === categoria
    );
  }

  renderizarProdutos(filtrados);
}


// =====================
// RENDER
// =====================
function renderizarProdutos(lista) {
  const div = document.getElementById("produtos");
  div.innerHTML = "";

  lista.forEach(p => {
    div.innerHTML += `
      <div class="card">
        <img src="${p.imagem}">
        <h4>${p.nome}</h4>
        <button class="btn">Ver oferta</button>
      </div>
    `;
  });
}


// =====================
// INICIAR
// =====================
renderizarProdutos(produtos);

</script>

</body>
</html>
