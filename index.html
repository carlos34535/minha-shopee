<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhaShopee - Ofertas</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Config extra (para limitar texto) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {}
            }
        }
    </script>

    <style>
        /* Limitar texto em 2 linhas */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">

<!-- ================= HEADER ================= -->
<header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-3">
        
        <!-- LOGO -->
        <h1 class="text-2xl font-bold text-orange-500">
            🛍️ MinhaShopee
        </h1>

        <!-- BUSCA -->
        <input 
            type="text" 
            id="busca"
            placeholder="🔍 Buscar produto..."
            class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-orange-500"
        >
    </div>
</header>


<!-- ================= HERO ================= -->
<section class="bg-gradient-to-r from-orange-500 to-pink-500 text-white text-center py-10">
    <h2 class="text-3xl font-bold">🔥 Ofertas do Dia</h2>
    <p class="mt-2">Aproveite antes que acabe!</p>
</section>


<!-- ================= PRODUTOS ================= -->
<section class="max-w-7xl mx-auto px-4 py-8">

    <h2 class="text-2xl font-bold text-center mb-6">
        Produtos em Destaque
    </h2>

    <!-- GRID -->
    <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

</section>


<!-- ================= RODAPÉ ================= -->
<footer class="text-center text-sm text-gray-500 py-6">
    © 2026 MinhaShopee - Ofertas selecionadas
</footer>


<!-- ================= SCRIPTS ================= -->
<script src="js/produtos.js"></script>
<script src="js/script.js"></script>

</body>
</html>
