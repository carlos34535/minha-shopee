<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produto - Achadinhos da Shopee</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header class="topo">
    <div class="container topo-conteudo">

      <a href="./index.html" class="logo-area">
        <img src="./assets/logo.png" alt="Logo Achadinhos" class="logo-img">

        <span class="logo-texto">
          Achadinhos <strong>da Shopee</strong>
        </span>
      </a>

    </div>
  </header>

  <main>

    <section class="produto-detalhe-section">
      <div class="container">

        <a href="./index.html" class="voltar">
          ← Voltar para ofertas
        </a>

        <div id="produtoDetalhe" class="produto-detalhe">
          <p style="color:white; font-size:18px;">
            Carregando produto...
          </p>
        </div>

      </div>
    </section>

  </main>

  <script>
    const produtoDetalhe = document.getElementById("produtoDetalhe");

    async function carregarProdutoDetalhe() {
      try {
        const parametros = new URLSearchParams(window.location.search);
        const idProduto = parametros.get("id");

        if (!idProduto) {
          produtoDetalhe.innerHTML = `
            <p style="color:white; font-size:18px;">
              Produto não encontrado. Volte para a página inicial e clique em uma oferta.
            </p>
          `;
          return;
        }

        const resposta = await fetch("./ofertas.csv?v=" + new Date().getTime());

        if (!resposta.ok) {
          throw new Error("Não encontrei o arquivo ofertas.csv");
        }

        const texto = await resposta.text();

        const produtos = converterCSVParaProdutos(texto);

        const produto = produtos.find(item => String(item.id) === String(idProduto));

        if (!produto) {
          produtoDetalhe.innerHTML = `
            <p style="color:white; font-size:18px;">
              Produto não encontrado no CSV.
            </p>
          `;
          return;
        }

        mostrarProduto(produto);

      } catch (erro) {
        console.error("Erro ao carregar produto:", erro);

        produtoDetalhe.innerHTML = `
          <p style="color:white; font-size:18px;">
            Erro ao carregar o produto. Confira se o arquivo ofertas.csv está na pasta principal.
          </p>
        `;
      }
    }

    function converterCSVParaProdutos(textoCSV) {
      const linhas = textoCSV.trim().split(/\r?\n/);

      if (linhas.length <= 1) {
        return [];
      }

      const cabecalho = separarLinhaCSV(linhas[0]).map(item => {
        return item.replace("\ufeff", "").trim();
      });

      const produtos = [];

      for (let i = 1; i < linhas.length; i++) {
        const linha = linhas[i];

        if (!linha.trim()) {
          continue;
        }

        const valores = separarLinhaCSV(linha);

        const produtoOriginal = {};

        cabecalho.forEach((coluna, index) => {
          produtoOriginal[coluna] = valores[index] ? valores[index].trim() : "";
        });

        const produto = {
          id: produtoOriginal["ID do item"] || i,
          nome: produtoOriginal["Nome do item"] || "Produto sem nome",
          imagem: produtoOriginal["Imagem"] || "",
          linkProduto: produtoOriginal["Link do produto"] || "",
          linkOferta: produtoOriginal["Link da oferta"] || ""
        };

        produtos.push(produto);
      }

      return produtos;
    }

    function separarLinhaCSV(linha) {
      const resultado = [];
      let valorAtual = "";
      let dentroDeAspas = false;

      for (let i = 0; i < linha.length; i++) {
        const caractere = linha[i];
        const proximoCaractere = linha[i + 1];

        if (caractere === '"' && dentroDeAspas && proximoCaractere === '"') {
          valorAtual += '"';
          i++;
        } else if (caractere === '"') {
          dentroDeAspas = !dentroDeAspas;
        } else if (caractere === "," && !dentroDeAspas) {
          resultado.push(valorAtual);
          valorAtual = "";
        } else {
          valorAtual += caractere;
        }
      }

      resultado.push(valorAtual);

      return resultado;
    }

    function mostrarProduto(produto) {
      const imagemProduto = produto.imagem && produto.imagem !== ""
        ? `./produtos/${produto.imagem}`
        : "./assets/logo.png";

      const linkFinal = produto.linkOferta && produto.linkOferta !== ""
        ? produto.linkOferta
        : produto.linkProduto;

      produtoDetalhe.innerHTML = `
        <div class="produto-detalhe-img">
          <img src="${imagemProduto}" alt="${produto.nome}">
        </div>

        <div class="produto-detalhe-info">
          <h1>${produto.nome}</h1>

          <p>
            Oferta selecionada entre os melhores achadinhos da Shopee. Clique no botão abaixo para acessar o produto.
          </p>

          <a href="${linkFinal}" target="_blank" class="btn-grande">
            Ir para oferta
          </a>
        </div>
      `;
    }

    carregarProdutoDetalhe();
  </script>

</body>
</html>
