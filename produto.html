<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produto - Achadinhos da Shopee</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header class="topo">
    <div class="container topo-conteudo">

      <a href="./index.html" class="logo-area">
        <img src="./assets/logo.png" alt="Logo Achadinhos" class="logo-img">

        <span class="logo-texto">
          Achadinhos <strong>da Shopee</strong>
        </span>
      </a>

    </div>
  </header>

  <main>
    <section class="produto-detalhe-section">
      <div class="container">

        <a href="./index.html" class="voltar">
          ← Voltar para ofertas
        </a>

        <div id="produtoDetalhe" class="produto-detalhe">
          <p style="color:white; font-size:18px;">
            Carregando produto...
          </p>
        </div>

      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      carregarProdutoDetalhe();
    });

    async function carregarProdutoDetalhe() {
      const produtoDetalhe = document.getElementById("produtoDetalhe");

      try {
        const parametros = new URLSearchParams(window.location.search);
        const idProduto = parametros.get("id");

        if (!idProduto) {
          produtoDetalhe.innerHTML = `
            <p style="color:white; font-size:18px;">
              Produto não encontrado.
            </p>
          `;
          return;
        }

        const resposta = await fetch("./ofertas.csv?v=" + Date.now());

        if (!resposta.ok) {
          produtoDetalhe.innerHTML = `
            <p style="color:white; font-size:18px;">
              Erro: o arquivo ofertas.csv não foi encontrado.
            </p>
          `;
          return;
        }

        const textoCSV = await resposta.text();

        const produtos = converterCSVParaProdutos(textoCSV);

        const produto = produtos.find(function (item) {
          return String(item.id) === String(idProduto);
        });

        if (!produto) {
          produtoDetalhe.innerHTML = `
            <p style="color:white; font-size:18px;">
              Produto não encontrado no CSV.
            </p>
          `;
          return;
        }

        const imagemProduto = produto.imagem && produto.imagem !== ""
          ? "./produtos/" + produto.imagem
          : "./assets/logo.png";

        produtoDetalhe.innerHTML = `
          <div class="produto-detalhe-img">
            <img src="${imagemProduto}" alt="${produto.nome}" onerror="this.onerror=null; this.src='./assets/logo.png';">
          </div>

          <div class="produto-detalhe-info">
            <h1>${produto.nome}</h1>

            <p>
              Oferta selecionada entre os melhores achadinhos da Shopee.
              Clique no botão abaixo para acessar o produto.
            </p>

            <a href="${produto.link}" target="_blank" rel="noopener noreferrer" class="btn-grande">
              Ir para oferta
            </a>
          </div>
        `;

      } catch (erro) {
        produtoDetalhe.innerHTML = `
          <p style="color:white; font-size:18px;">
            Erro ao carregar o produto: ${erro.message}
          </p>
        `;

        console.error(erro);
      }
    }

    function converterCSVParaProdutos(textoCSV) {
      const linhas = textoCSV.trim().split(/\r?\n/);

      if (linhas.length <= 1) {
        return [];
      }

      const produtos = [];

      for (let i = 1; i < linhas.length; i++) {
        const linha = linhas[i];

        if (!linha.trim()) {
          continue;
        }

        const valores = separarLinhaCSV(linha);

        produtos.push({
          id: valores[0] ? valores[0].trim() : `produto${i}`,
          nome: valores[1] ? valores[1].trim() : "Produto sem nome",
          link: valores[2] ? valores[2].trim() : "#",
          imagem: valores[3] ? valores[3].trim() : ""
        });
      }

      return produtos;
    }

    function separarLinhaCSV(linha) {
      const resultado = [];
      let valorAtual = "";
      let dentroDeAspas = false;

      for (let i = 0; i < linha.length; i++) {
        const caractere = linha[i];
        const proximoCaractere = linha[i + 1];

        if (caractere === '"' && dentroDeAspas && proximoCaractere === '"') {
          valorAtual += '"';
          i++;
        } else if (caractere === '"') {
          dentroDeAspas = !dentroDeAspas;
        } else if (caractere === "," && !dentroDeAspas) {
          resultado.push(valorAtual);
          valorAtual = "";
        } else {
          valorAtual += caractere;
        }
      }

      resultado.push(valorAtual);

      return resultado;
    }
  </script>

</body>
</html>
